name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare the site
        run: node scripts/prepare-site.mjs

      - name: Check the payload is servable
        run: |
          set -euo pipefail
          test -f site/play/Build/WebGL.wasm
          test -f site/play/Build/WebGL.data
          test -f site/play/Build/WebGL.loader.js
          test -f site/play/Build/WebGL.framework.js
          test -f site/index.html
          ! grep -q '\.br"' site/play/index.html
          head -c 4 site/play/Build/WebGL.wasm | od -An -c | grep -q '\\0   a   s   m'
          du -sh site

      # The account layer is the one thing a Unity re-export can silently strip: the
      # template is regenerated, index.html is replaced, and the game still boots — it
      # just stops saving to the cloud. These checks are the regression guard.
      - name: Check the arcade account layer survived
        run: |
          set -euo pipefail
          test -f site/play/arcade-unity.js
          test -f site/play/arcade-client.js
          grep -q 'arcade-unity.js" data-game-id="orb-frenzy-3d"' site/play/index.html
          grep -q 'arcade-client.js" data-game-id="orb-frenzy-3d"' site/play/index.html
          # The shim must load before the client: it defines LJA_UnitySave, which the
          # client reads through its LJA_SNAPSHOT hook.
          shim=$(grep -bo 'arcade-unity.js' site/play/index.html | head -1 | cut -d: -f1)
          client=$(grep -bo 'arcade-client.js' site/play/index.html | head -1 | cut -d: -f1)
          test "$shim" -lt "$client"
          # No privileged key may ever ship in a page asset.
          ! grep -q 'service_role' site/play/arcade-unity.js site/play/arcade-client.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
